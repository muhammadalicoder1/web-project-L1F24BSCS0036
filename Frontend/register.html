<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Junaid Tech - Customer Registration & Pre-Order</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <!-- Restyled Navigation Bar for Page 3 -->
  <nav class="reg-nav">
    <a href="index.html">Home</a>
    <a href="media.html">Media & Info</a>
    <a href="register.html">Register</a>
    <a href="services.html">Services</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main class="container my-4">
    <form class="reg-form p-4">
      <h2 class="form-heading">Junaid Tech Customer Account & Order Verification</h2>
      <p>Register your account and submit your WhatsApp price confirmation form below.</p>

      <div class="row g-3">

        <!-- 1. readonly & 2. disabled -->
        <div class="col-md-6">
          <label>Official Store WhatsApp</label>
          <input type="text" class="form-control" value="03205505112 (Junaid Tech)" readonly>
        </div>
        <div class="col-md-6">
          <label>GPU/RAM Price Lock Status</label>
          <input type="text" class="form-control" value="Disabled Due to Memory Shortage" disabled>
        </div>

        <!-- 3. text (required, minlength, maxlength) & 4. password -->
        <div class="col-md-6">
          <label>Customer Full Name</label>
          <input type="text" class="form-control" placeholder="Enter full name" minlength="3" maxlength="30" required>
        </div>
        <div class="col-md-6">
          <label>Account Password</label>
          <input type="password" class="form-control" placeholder="6 to 20 characters" minlength="6" maxlength="20" required>
        </div>

        <!-- 5. email & 6. url -->
        <div class="col-md-6">
          <label>Email Address</label>
          <input type="email" class="form-control" placeholder="name@example.com" required>
        </div>
        <div class="col-md-6">
          <label>Product Link from junaidtech.pk (URL)</label>
          <input type="url" class="form-control" placeholder="https://www.junaidtech.pk/">
        </div>

        <!-- 7. date & 8. time -->
        <div class="col-md-6">
          <label>Expected Pickup / Order Date</label>
          <input type="date" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label>Store Visit Time (12 PM - 8 PM)</label>
          <input type="time" class="form-control">
        </div>

        <!-- 9. number (min, max) & 10. range -->
        <div class="col-md-6">
          <label>Order Quantity (Max 5 per customer)</label>
          <input type="number" class="form-control" min="1" max="5" value="1" required>
        </div>
        <div class="col-md-6">
          <label>PC Budget Range (Rs. 10k - Rs. 500k)</label>
          <input type="range" class="form-range" min="10" max="500">
        </div>

        <!-- 11. color & 12. select (with selected) -->
        <div class="col-md-6">
          <label>Preferred Case / Peripheral RGB Color</label>
          <input type="color" class="form-control form-control-color" value="#ffff00">
        </div>
        <div class="col-md-6">
          <label>Product Category</label>
          <select class="form-select">
            <option value="components">PC Components (CPU / GPU / RAM)</option>
            <option value="peripherals" selected>PC Peripherals (Aula / ATK / Razer)</option>
            <option value="storage">Storage Devices (Samsung SSD / HDD)</option>
            <option value="chairs">Gaming Furniture (Anda Seat Chairs)</option>
          </select>
        </div>

        <!-- 13. file -->
        <div class="col-md-12">
          <label>Upload JazzCash / Bank Transfer Receipt</label>
          <input type="file" class="form-control">
        </div>

        <!-- 14. radio & checkbox (with checked) -->
        <div class="col-md-6">
          <label class="d-block">Payment Method</label>
          <input type="radio" name="pay" checked> Bank Transfer / JazzCash
          <input type="radio" name="pay" class="ms-2"> Credit Card
        </div>
        <div class="col-md-6">
          <label class="d-block">Order Terms</label>
          <input type="checkbox" checked required> I reconfirmed price on WhatsApp (03205505112)
        </div>

        <!-- 15. textarea -->
        <div class="col-md-12">
          <label>Delivery Address & Order Notes</label>
          <textarea class="form-control" rows="2" maxlength="200" placeholder="Enter complete shipping address..."></textarea>
        </div>

        <div class="col-md-12">
          <button type="submit" class="submit-btn">Submit Order & Register</button>
        </div>

      </div>
    </form>
  </main>

</body>
</html>
